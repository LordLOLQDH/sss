<style>

;border:1px solid var(--line);border-radius:8px;max-width:110px}.modalcover{display:none;position:fixed;inset:0;background:#112a1e77;z-index:30;align-items:center;justify-content:center;padding:16px}.modal{width:min(430px,100%);background:white;border-radius:14px;padding:20px}.modalfoot{display:flex;justify-content:end;gap:8px;margin-top:16px}.hide{display:none!important}
@media(max-width:950px){.layout{grid-template-columns:190px 1fr}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.drivegrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.layout{display:block}.side{position:sticky;top:0;z-index:10;padding:9px;border-right:0;border-bottom:1px solid var(--line);gap:7px}.brand{padding:0 4px}.navgroup{flex-direction:row;overflow-x:auto;align-items:center;white-space:nowrap}.navlabel{display:none}.navbtn{padding:8px 9px;font-size:11px;flex:0 0 auto}.sidebottom{display:none}main{padding:14px 11px}.pageTitle{font-size:22px}.cards{gap:7px}.card{padding:11px}.cardvalue{font-size:21px}.drivegrid{grid-template-columns:1fr}}
</style></head><body><div class="layout">
<aside class="side"><div class="brand"><div class="brandmark">SSS</div><div>SchoolServer Security<small>SERVER SECURITY CONSOLE</small></div></div>
<div class="navgroup"><div class="navlabel">ÜBERWACHUNG</div>
<button class="navbtn active" data-page="overview">▦ Übersicht</button><button class="navbtn" data-page="files">▤ Dateien</button><button class="navbtn" data-page="users">♙ Benutzer</button><button class="navbtn" data-page="drives">▣ Laufwerke</button><button class="navbtn" data-page="quarantine">▧ Quarantäne</button><button class="navbtn" data-page="events">≡ Ereignisprotokoll</button></div>
<div class="navgroup"><div class="navlabel">SYSTEM</div><button class="navbtn" data-page="emergency">⚠ Notfallmaßnahmen</button><button class="navbtn" data-page="settings">⚙ Scan-Einstellungen</button></div><div class="sidebottom">SIMULATOR · Änderungen werden beim Neuladen zurückgesetzt.</div></aside>
<main><div id="content"><div class="panel">GUI wird geladen…</div></div></main></div>
<div id="confirm" class="modalcover"><div class="modal"><h2 id="confirmTitle">Aktion bestätigen</h2><p id="confirmText"></p><div class="modalfoot"><button class="btn" id="confirmCancel">Abbrechen</button><button class="btn danger" id="confirmOK">Bestätigen</button></div></div></div>
<script>
"use strict";
const initialFiles=[
["f1","Stundenplan_2026.pdf","/share/unterricht","S:","2.4 MB","PDF","clean","Normales Dokument"],
["f2","ferienliste.xlsx","/share/verwaltung","S:","184 KB","Excel","clean","Unauffällige Office-Datei"],
["f3","rechnung_final.pdf.exe","/downloads","D:","76 KB","Executable","malicious","Doppelte Endung, ausführbare Datei"],
["f4","photo_ferien.jpg.scr","/users/anna","U:","98 KB","SCR","malicious","Bild-Endung tarnt ausführbaren Inhalt"],
["f5","~$budgetplanung.xlsx","/share/verwaltung","S:","12 KB","Temp","clean","Legitime Office-Sperrdatei"],
["f6","svchost_update.dll","/system/cache","C:","312 KB","DLL","suspicious","Systemähnlicher Name in ungewöhnlichem Pfad"],
["f7","Sommerfest_Fotos.zip","/share/events","S:","21 MB","ZIP","clean","Unauffälliges Archiv"],
["f8","Dokument.pdf","/users/max","U:","44 KB","PDF","malicious","Testindikator trotz neutralem Namen"],
["f9","Schulferien_2027.docx","/sekretariat","S:","156 KB","DOCX","clean","Unauffälliges Dokument"],
["f10","backup_001.dat","/system/backup","C:","4.8 MB","DAT","suspicious","Unbekannter Dateityp im Systembereich"],
["f11","Notizen.txt","/users/lena","U:","8 KB","TXT","clean","Unauffällige Textdatei"],
["f12","drucker_driver.tmp","/system/temp","C:","65 KB","TMP","suspicious","Temporärdatei in Systemnähe"],
["f13","Präsentation.pptx","/classes/8a","S:","3.1 MB","PPTX","clean","Normale Präsentation"],
["f14","update_service.exe","/system/services","C:","860 KB","EXE","malicious","Simulierte Testsignatur"],
["f15","Kursmaterial.zip","/share/lehrer","S:","15 MB","ZIP","clean","Unterrichtsarchiv"],
["f16","readme.txt.exe","/share/public","S:","28 KB","EXE","malicious","Executable tarnt sich als Textdatei"],
["f17","desktop.ini","/users/anna","U:","1 KB","INI","clean","Übliche Windows-Metadatei"],
["f18","cache-index.bin","/system/cache","C:","2.2 MB","BIN","suspicious","Unbekannte Binärdatei im Cache"]
].map(a=>({id:a[0],name:a[1],path:a[2],drive:a[3],size:a[4],type:a[5],state:a[6],detail:a[7]}));
const users=[{id:"u1",user:"anna.schmidt",name:"Anna Schmidt",role:"Lehrkraft",drive:"U:",status:"Aktiv"},{id:"u2",user:"max.mueller",name:"Max Müller",role:"Schüler",drive:"U:",status:"Aktiv"},{id:"u3",user:"lena.weber",name:"Lena Weber",role:"Schüler",drive:"U:",status:"Aktiv"},{id:"u4",user:"admin",name:"IT-Administrator",role:"Admin",drive:"C: / S:",status:"Aktiv"},{id:"u5",user:"sekretariat",name:"Sekretariat",role:"Verwaltung",drive:"S:",status:"Aktiv"},{id:"u6",user:"gast-07",name:"Gastkonto 07",role:"Gast",drive:"U:",status:"Aktiv"},{id:"u7",user:"technik",name:"Technik",role:"Service",drive:"C:",status:"Aktiv"}];
const drives=[{letter:"C:",name:"System",total:120,used:72,status:"Online"},{letter:"S:",name:"Schulfreigabe",total:500,used:316,status:"Online"},{letter:"U:",name:"Benutzer",total:250,used:129,status:"Online"},{letter:"D:",name:"Downloads",total:80,used:22,status:"Online"}];
let files=initialFiles.map(f=>({...f})),quarantine=[],events=[],serverLocked=false,scanEvery=10,scanTimer=null,scanCount=0,scanning=false,previousResults=[],activePage="overview",pendingAction=null;
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function log(msg){events.unshift({time:new Date().toLocaleTimeString("de-DE"),msg});events=events.slice(0,100)}
function badge(label,kind=""){return '<span class="tag '+kind+'">'+label+'</span>'}
function header(title,subtitle,button=""){return '<div class="topline"><div><div class="pageTitle">'+title+'</div><div class="subtitle">'+subtitle+'</div></div>'+button+'</div>'}
function stat(label,value,hint){return '<div class="card"><div class="cardlabel">'+label+'</div><div class="cardvalue">'+value+'</div><div class="cardhint">'+hint+'</div></div>'}
function scanBtn(){return '<button class="btn primary" onclick="runScan()">Scan jetzt ausführen</button>'}
function tableRows(rows){return rows.map(f=>'<tr><td><b>'+esc(f.name)+'</b><span class="smallmuted">'+esc(f.size)+' · '+esc(f.type)+'</span></td><td>'+esc(f.path)+'<span class="smallmuted">'+esc(f.drive)+'</span></td><td>'+badge(f.state==="clean"?"Unauffällig":f.state==="malicious"?"Malware-Test":"Verdächtig",f.state==="clean"?"good":f.state==="malicious"?"bad":"warn")+'</td><td>'+esc(f.analysis||f.detail)+'</td><td>'+(f.state==="malicious"||f.state==="suspicious"?'<button class="btn tiny" onclick="quarantineFile(\''+f.id+'\')">Quarantäne</button>':"")+'</td></tr>').join("")}
function filesTable(list){return '<div class="tablewrap"><table class="table"><thead><tr><th>Dateiname</th><th>Pfad / Laufwerk</th><th>Status</th><th>Analyse</th><th>Aktion</th></tr></thead><tbody>'+tableRows(list)+'</tbody></table></div>'}
function logs(n=6){return events.length?events.slice(0,n).map(e=>'<div class="log"><span class="logtime">'+e.time+'</span><span>'+esc(e.msg)+'</span></div>').join(""):'<div class="empty">Noch keine Ereignisse</div>'}
function overview(){let d=files.filter(f=>f.state!=="clean").length;return header("Serverübersicht","Virtueller Server · "+(serverLocked?"gesperrt":"online"),scanBtn())+(serverLocked?'<div class="notice red">Server im Simulator gesperrt. Scans und Aktionen blockiert.</div>':'<div class="notice">Isolierte Simulation: Beispieldaten, Benutzer, Laufwerke und Dateien. Keine Verbindung zu echten Servern.</div>')+'<div class="cards">'+stat("Serverstatus",serverLocked?"GESPERRT":"ONLINE","SSS-Simulator")+stat("Benutzer",users.length,users.filter(u=>u.status==="Gesperrt").length+" gesperrt")+stat("Dateien",files.length,"Virtueller Bestand")+stat("Bedrohungsindikatoren",d,"Testfälle und Auffälligkeiten")+'</div><div class="grid2"><section class="panel"><div class="panelhead"><b>Letzte Prüfergebnisse</b><span class="smallmuted">'+(scanCount?"Scan #"+scanCount:"Noch kein Scan")+'</span></div>'+(previousResults.length?filesTable(previousResults.slice(0,6)):'<div class="empty">Scan starten, um Ergebnisse zu sehen</div>')+'</section><section class="panel"><div class="panelhead"><b>Laufwerksstatus</b></div>'+drives.map(d=>'<div class="panelhead"><b>'+d.letter+' · '+d.name+'</b>'+badge(d.status,d.status==="Online"?"good":"bad")+'</div><div class="smallmuted">'+d.used+' GB / '+d.total+' GB</div><div class="bar"><span style="width:'+Math.round(d.used/d.total*100)+'%"></span></div>').join("")+'</section></div><section class="panel"><div class="panelhead"><b>Aktuelle Ereignisse</b><button class="btn tiny" onclick="navigate(\'events\')">Alle anzeigen</button></div>'+logs(5)+'</section>'}
function filesPage(){return header("Dateiüberwachung","Vorgegebene Server-Dateien · kein Datei-Upload",scanBtn())+'<section class="panel"><div class="panelhead"><b>Virtueller Datei-Bestand</b><span class="smallmuted">'+files.length+' Einträge</span></div>'+filesTable(files)+'</section>'}
function usersPage(){return header("Benutzerverwaltung","Konten im virtuellen Server")+'<section class="panel"><div class="panelhead"><b>Benutzerkonten</b><span class="smallmuted">'+users.length+' Konten</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Benutzer</th><th>Rolle</th><th>Laufwerk</th><th>Status</th><th>Aktion</th></tr></thead><tbody>'+users.map(u=>'<tr><td><b>'+esc(u.user)+'</b><span class="smallmuted">'+esc(u.name)+'</span></td><td>'+esc(u.role)+'</td><td>'+esc(u.drive)+'</td><td>'+badge(u.status,u.status==="Aktiv"?"good":"bad")+'</td><td><button class="btn tiny '+(u.status==="Aktiv"?"danger":"")+'" onclick="toggleUser(\''+u.id+'\')">'+(u.status==="Aktiv"?"Sperren":"Entsperren")+'</button></td></tr>').join("")+'</tbody></table></div></section>'}
function drivesPage(){return header("Laufwerke","Speicherbelegung und simulierte Laufwerkssperren")+'<div class="drivegrid">'+drives.map(d=>'<section class="drive"><div class="drivehead"><div><div class="driveletter">'+d.letter+'</div><b>'+d.name+'</b></div>'+badge(d.status,d.status==="Online"?"good":"bad")+'</div><p class="smallmuted">'+d.used+' GB von '+d.total+' GB belegt</p><div class="bar"><span style="width:'+Math.round(d.used/d.total*100)+'%"></span></div><button class="btn tiny '+(d.status==="Online"?"danger":"")+'" onclick="toggleDrive(\''+d.letter+'\')">'+(d.status==="Online"?"Laufwerk sperren":"Entsperren")+'</button></section>').join("")+'</div>'}
function quarantinePage(){return header("Quarantäne","Isolierte Dateien · Rücknahme jederzeit möglich")+'<section class="panel"><div class="panelhead"><b>Quarantänebestand</b><span class="smallmuted">'+quarantine.length+' Dateien</span></div>'+(quarantine.length?'<div class="tablewrap"><table class="table"><thead><tr><th>Datei</th><th>Originalpfad</th><th>Aktion</th></tr></thead><tbody>'+quarantine.map(f=>'<tr><td>'+esc(f.name)+'</td><td>'+esc(f.path)+'</td><td><button class="btn tiny" onclick="restoreFile(\''+f.id+'\')">Wiederherstellen</button></td></tr>').join("")+'</tbody></table></div>':'<div class="empty">Quarantäne ist leer. Verdächtige Dateien in „Dateien“ lassen sich isolieren.</div>')+'</section>'}
function eventsPage(){return header("Ereignisprotokoll","Scan-, Sperr- und Quarantäneereignisse",'<button class="btn" onclick="clearEvents()">Protokoll leeren</button>')+'<section class="panel">'+logs(100)+'</section>'}
function emergencyPage(){return header("Notfallmaßnahmen","Sperren im Simulator")+'<div class="notice red">Alle Aktionen sind simuliert und betreffen ausschließlich diesen Browserzustand.</div><div class="cards">'+stat("Server",serverLocked?"GESPERRT":"ONLINE","Gesamtzugriff")+stat("Aktive Benutzer",users.filter(u=>u.status==="Aktiv").length,"Konten")+stat("Online-Laufwerke",drives.filter(d=>d.status==="Online").length,"Laufwerke")+stat("Quarantäne",quarantine.length,"Isolierte Dateien")+'</div><div class="grid2"><section class="panel"><b>Server</b><p class="smallmuted">Gesamten simulierten Zugriff blockieren oder freigeben.</p><button class="btn danger" onclick="ask(\'serverLock\')">Server sperren</button> <button class="btn" onclick="ask(\'serverUnlock\')">Entsperren</button></section><section class="panel"><b>Massenaktionen</b><p class="smallmuted">Alle Konten oder Laufwerke.</p><div class="settingsline"><button class="btn danger" onclick="ask(\'usersLock\')">Alle Nutzer sperren</button><button class="btn" onclick="ask(\'usersUnlock\')">Alle entsperren</button><button class="btn danger" onclick="ask(\'drivesLock\')">Alle Laufwerke sperren</button><button class="btn" onclick="ask(\'drivesUnlock\')">Laufwerke entsperren</button></div></section></div>'}
function settingsPage(){return header("Scan-Einstellungen","Automatische Überwachung und Intervall")+'<section class="panel"><b>Automatischer Scan</b><p class="smallmuted">Standardmäßig alle 10 Minuten. Der Timer läuft während diese Seite geöffnet ist.</p><div class="settingsline"><label>Intervall (Minuten)</label><input type="number" id="intervalInput" min="1" max="1440" value="'+scanEvery+'"><button class="btn primary" onclick="saveInterval()">Speichern</button><button class="btn" onclick="runScan()">Sofort prüfen</button></div></section><section class="panel"><b>Aktive Prüfregeln</b><ul class="smallmuted"><li>Vorgegebene versteckte Testindikatoren</li><li>Mehrfach-Endungen und ausführbare Endungen</li><li>Systemähnliche Namen und ungewöhnliche Pfade</li><li>Neutral benannte Testdateien mit Indikator</li><li>Harmlose Dateien mit ungewöhnlichen Namen als Gegenprobe</li></ul></section>'}
function render(page){const views={overview,files:filesPage,users:usersPage,drives:drivesPage,quarantine:quarantinePage,events:eventsPage,emergency:emergencyPage,settings:settingsPage};$("content").innerHTML=views[page]();document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.page===page))}
function navigate(page){activePage=page;render(page)}
document.querySelectorAll(".navbtn").forEach(b=>b.addEventListener("click",()=>navigate(b.dataset.page)));
function classify(f){const n=f.name.toLowerCase(),p=f.path.toLowerCase(),ext=n.split(".").pop();const critical=["exe","scr","bat","cmd","ps1","vbs","msi"];const doubleExt=/\.(pdf|jpg|png|txt|docx|xlsx)\.(exe|scr|bat|cmd|js)$/i.test(n);const systemName=/svchost|winlogon|lsass|update_service|system32/i.test(n);const hiddenTest=f.state==="malicious";const oddSystemPath=/\/(system|cache|temp)/.test(p)&&["dat","tmp","bin","dll"].includes(ext);const harmless=["desktop.ini","~$budgetplanung.xlsx","notizen.txt","stundenplan_2026.pdf","ferienliste.xlsx","schulferien_2027.docx","sommerfest_fotos.zip","kursmaterial.zip","präsentation.pptx"].includes(n);if(hiddenTest||doubleExt||critical.includes(ext)&&!harmless)return {status:"Bedrohung erkannt",analysis:hiddenTest?"Verdeckter Testindikator erkannt.":doubleExt?"Mehrfach-Endung tarnt ausführbaren Inhalt.":"Kritische Dateiendung: "+ext.toUpperCase()};if(systemName||oddSystemPath||f.state==="suspicious")return {status:"Verdächtig",analysis:systemName?"Systemähnlicher Name geprüft.":oddSystemPath?"Ungewöhnlicher Dateityp im System-/Cache-Pfad.":f.detail};return {status:"Kein Treffer",analysis:"Datei unauffällig · Gegenprobe bestanden."}}
function runScan(){if(serverLocked){log("Scan verhindert · Server gesperrt");render(activePage);return}if(scanning)return;scanning=true;scanCount++;log("Scan #"+scanCount+" gestartet · "+files.length+" Dateien");render(activePage);let i=0,out=[];const tick=setInterval(()=>{if(serverLocked){clearInterval(tick);scanning=false;log("Scan abgebrochen · Server wurde gesperrt");render(activePage);return}if(i>=files.length){clearInterval(tick);scanning=false;previousResults=out;log("Scan #"+scanCount+" abgeschlossen · "+out.filter(x=>x.status!=="Kein Treffer").length+" Auffälligkeiten");render(activePage);return}let f=files[i++],r=classify(f);out.push({...f,...r});},65)}
function quarantineFile(id){if(serverLocked)return alert("Server gesperrt.");let f=files.find(x=>x.id===id);if(!f)return;quarantine.push({...f,originalState:f.state});files=files.filter(x=>x.id!==id);log("Quarantäne: "+f.name);render(activePage)}
function restoreFile(id){let f=quarantine.find(x=>x.id===id);if(!f)return;quarantine=quarantine.filter(x=>x.id!==id);files.push({...f,state:f.originalState||"suspicious"});log("Wiederhergestellt: "+f.name);render(activePage)}
function toggleUser(id){if(serverLocked)return alert("Server gesperrt.");let u=users.find(x=>x.id===id);if(!u)return;u.status=u.status==="Aktiv"?"Gesperrt":"Aktiv";log("Konto "+u.user+" "+u.status);render(activePage)}
function toggleDrive(letter){if(serverLocked)return alert("Server gesperrt.");let d=drives.find(x=>x.letter===letter);if(!d)return;d.status=d.status==="Online"?"Offline":"Online";log("Laufwerk "+letter+" "+d.status);render(activePage)}
function clearEvents(){events=[];render(activePage)}
function saveInterval(){let n=Number($("intervalInput").value);if(!Number.isInteger(n)||n<1||n>1440)return alert("Intervall muss 1 bis 1440 Minuten betragen.");scanEvery=n;if(scanTimer)clearInterval(scanTimer);scanTimer=setInterval(runScan,scanEvery*60000);log("Scanintervall: "+n+" Minuten");render(activePage)}
const texts={serverLock:"Den virtuellen Server sperren?",serverUnlock:"Server wieder freigeben?",usersLock:"Alle simulierten Benutzer sperren?",usersUnlock:"Alle Benutzer freigeben?",drivesLock:"Alle Laufwerke sperren?",drivesUnlock:"Alle Laufwerke freigeben?"};
