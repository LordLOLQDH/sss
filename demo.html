<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSS · Server Security Simulator</title>
<style>
:root{--bg:#f3f7f5;--white:#fff;--ink:#192b22;--muted:#6c7e73;--line:#e0e9e3;--green:#168d4d;--green2:#e7f5ec;--red:#c63832;--redbg:#fff0ee;--amber:#946817;--amberbg:#fff5df;--shadow:0 10px 35px #163d2410}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.layout{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:20px}.brand{display:flex;align-items:center;gap:10px;font-weight:850;padding:0 8px}.brandmark{background:var(--green2);color:var(--green);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;font-weight:900}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:600}.navgroup{display:flex;flex-direction:column;gap:4px}.navlabel{color:#86958c;font-size:10px;font-weight:800;letter-spacing:.1em;padding:0 10px;margin:6px 0}.navbtn{border:0;background:transparent;text-align:left;padding:10px;border-radius:9px;color:#4f6056;font-weight:650;display:flex;gap:10px;align-items:center}.navbtn:hover{background:#f5f8f6}.navbtn.active{background:var(--green2);color:var(--green)}.navbtn .glyph{width:19px;text-align:center}.sidebottom{margin-top:auto;background:#f6f9f7;border:1px solid var(--line);border-radius:11px;padding:12px;font-size:12px;color:var(--muted)}main{min-width:0;padding:24px clamp(14px,3vw,34px);max-width:1500px;width:100%;margin:auto}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}.pageTitle{font-size:26px;font-weight:850;letter-spacing:-.04em}.subtitle{color:var(--muted);font-size:12px}.statuspill{border-radius:99px;padding:5px 9px;background:var(--green2);color:var(--green);font-size:11px;font-weight:800;display:inline-flex;align-items:center;gap:6px}.statuspill.red{background:var(--redbg);color:var(--red)}.statuspill.amber{background:var(--amberbg);color:var(--amber)}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{background:white;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 12px;font-weight:700}.btn:hover{background:#f5f8f6}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.primary:hover{background:#08733b}.btn.danger{background:var(--red);color:white;border-color:var(--red)}.btn.tiny{font-size:11px;padding:6px 9px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:15px;box-shadow:var(--shadow);min-width:0}.cardlabel{font-size:12px;color:var(--muted);font-weight:650}.cardvalue{font-size:26px;font-weight:850;letter-spacing:-.03em;margin-top:4px}.cardhint{font-size:11px;color:var(--muted);margin-top:3px}.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.paneltitle{font-weight:800;font-size:15px}.smallmuted{color:var(--muted);font-size:12px}.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.table{width:100%;border-collapse:collapse;min-width:620px}.table th{text-align:left;color:var(--muted);background:#f7faf8;font-size:10px;letter-spacing:.04em;padding:10px;border-bottom:1px solid var(--line)}.table td{padding:10px;border-bottom:1px solid #edf2ef;vertical-align:top;font-size:12px}.table tr:last-child td{border:0}.table td .smallmuted{display:block;font-size:11px}.tag{display:inline-block;border-radius:30px;padding:3px 7px;font-size:10px;font-weight:800;background:#edf3ef;color:#5e7165}.tag.good{background:var(--green2);color:var(--green)}.tag.warn{background:var(--amberbg);color:var(--amber)}.tag.bad{background:var(--redbg);color:var(--red)}.rowbtns{display:flex;gap:5px;flex-wrap:wrap}.loglist{display:flex;flex-direction:column}.log{padding:10px 0;border-bottom:1px solid #edf2ef;display:grid;grid-template-columns:80px 1fr;gap:9px;font-size:12px}.log:last-child{border:0}.logtime{color:var(--muted);font-size:11px}.empty{padding:26px;text-align:center;color:var(--muted)}.notice{background:var(--amberbg);border:1px solid #f1dfb8;border-radius:11px;padding:12px;font-size:12px;color:#73551a;margin-bottom:14px}.notice.red{background:var(--redbg);border-color:#f2c6c2;color:#982c27}.progress{height:5px;background:#e8f1eb;border-radius:10px;overflow:hidden;display:none;margin:9px 0}.progress>span{display:block;height:100%;width:0;background:var(--green);transition:width .25s}.drivegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.drive{border:1px solid var(--line);background:white;border-radius:12px;padding:14px}.drivehead{display:flex;justify-content:space-between;align-items:center}.driveletter{font-size:20px;font-weight:850}.bar{height:8px;background:#edf2ef;border-radius:10px;margin:12px 0 7px;overflow:hidden}.bar span{display:block;height:100%;background:var(--green);border-radius:10px}.settingsline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.settingsline input{padding:9px;border:1px solid var(--line);border-radius:8px;max-width:110px}.hide{display:none!important}.footerNote{font-size:11px;color:var(--muted);padding:12px 2px}.modalcover{display:none;position:fixed;inset:0;background:#112a1e77;z-index:30;align-items:center;justify-content:center;padding:16px}.modal{width:min(440px,100%);background:white;border-radius:15px;padding:20px}.modal h2{margin:0 0 8px;font-size:19px}.modal p{font-size:13px;color:var(--muted)}.modalfoot{display:flex;justify-content:end;gap:8px;margin-top:18px}
@media(max-width:950px){.layout{grid-template-columns:205px 1fr}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.drivegrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.layout{display:block}.side{position:sticky;top:0;z-index:10;padding:10px;border-right:0;border-bottom:1px solid var(--line;);gap:7px}.brand{padding:0 4px}.navgroup{flex-direction:row;overflow-x:auto}.navlabel{display:none}.navbtn{white-space:nowrap;padding:8px 9px;font-size:11px}.sidebottom{display:none}main{padding:15px 11px}.pageTitle{font-size:22px}.cards{gap:8px}.card{padding:12px}.cardvalue{font-size:23px}.drivegrid{grid-template-columns:1fr}.panel{padding:12px}}
</style></head><body>
<div class="layout">
<aside class="side"><div class="brand"><div class="brandmark">SSS</div><div>SchoolServer Security<small>SERVER SECURITY CONSOLE</small></div></div>
<div class="navgroup"><div class="navlabel">ÜBERWACHUNG</div>
<button class="navbtn active" data-page="overview"><span class="glyph">▦</span>Übersicht</button>
<button class="navbtn" data-page="files"><span class="glyph">▤</span>Dateien</button>
<button class="navbtn" data-page="users"><span class="glyph">♙</span>Benutzer</button>
<button class="navbtn" data-page="drives"><span class="glyph">▣</span>Laufwerke</button>
<button class="navbtn" data-page="quarantine"><span class="glyph">▧</span>Quarantäne <span id="qbadge" class="tag bad hide">0</span></button>
<button class="navbtn" data-page="events"><span class="glyph">≡</span>Ereignisprotokoll</button>
</div>
<div class="navgroup"><div class="navlabel">SYSTEM</div><button class="navbtn" data-page="emergency"><span class="glyph">⚠</span>Notfallmaßnahmen</button><button class="navbtn" data-page="settings"><span class="glyph">⚙</span>Scan-Einstellungen</button></div>
<div class="sidebottom">SIMULATOR · Änderungen gelten nur für diese Sitzung und werden beim Neuladen zurückgesetzt.</div></aside>
<main><div id="content"></div></main>
</div>
<div id="confirm" class="modalcover"><div class="modal"><h2 id="confirmTitle">Aktion bestätigen</h2><p id="confirmText">Bitte bestätigen.</p><div class="modalfoot"><button class="btn" id="confirmCancel">Abbrechen</button><button class="btn danger" id="confirmOK">Bestätigen</button></div></div>
<script>
/* Intentionally session-only: reloading reconstructs this initial state. */
const initialFiles=[
{id:"f01",name:"Stundenplan_2026.pdf",path:"/home/share/schule/unterricht",drive:"S:",size:"2.4 MB",type:"PDF",state:"clean",detail:"Normale Dokumentdatei"},
{id:"f02",name:"ferienliste.xlsx",path:"/home/share/verwaltung",drive:"S:",size:"184 KB",type:"Excel",state:"clean",detail:"Office-Datei, keine auffälligen Merkmale"},
{id:"f03",name:"rechnung_final.pdf.exe",path:"/home/share/downloads",drive:"D:",size:"76 KB",type:"Executable",state:"malicious",detail:"Doppelte Dateiendung tarnt ausführbare Datei"},
{id:"f04",name:"photo_ferien.jpg.scr",path:"/home/share/user/anna",drive:"U:",size:"98 KB",type:"Screen saver",state:"malicious",detail:"Bildname mit ausführbarer Endung"},
{id:"f05",name:"~$budgetplanung.xlsx",path:"/home/share/verwaltung",drive:"S:",size:"12 KB",type:"Temp Office",state:"clean",detail:"Legitime Office-Sperrdatei"},
{id:"f06",name:"svchost_update.dll",path:"/system/cache",drive:"C:",size:"312 KB",type:"DLL",state:"suspicious",detail:"Systemähnlicher Name in ungewöhnlichem Verzeichnis"},
{id:"f07",name:"Sommerfest_Fotos.zip",path:"/home/share/events",drive:"S:",size:"21 MB",type:"ZIP",state:"clean",detail:"Archivdatei"},
{id:"f08",name:"Dokument.pdf",path:"/home/share/user/max",drive:"U:",size:"44 KB",type:"PDF",state:"malicious",detail:"Testsignatur erkannt, Dateiname unauffällig"},
{id:"f09",name:"Schulferien_2027.docx",path:"/home/share/sekretariat",drive:"S:",size:"156 KB",type:"Word",state:"clean",detail:"Normales Dokument"},
{id:"f10",name:"backup_001.dat",path:"/system/backup",drive:"C:",size:"4.8 MB",type:"DAT",state:"suspicious",detail:"Unbekannte Datei in geschütztem Systempfad"},
{id:"f11",name:"Notizen.txt",path:"/home/share/user/lena",drive:"U:",size:"8 KB",type:"Text",state:"clean",detail:"Textdatei, unauffälliger Inhalt"},
{id:"f12",name:"drucker_driver.tmp",path:"/system/temp",drive:"C:",size:"65 KB",type:"TMP",state:"suspicious",detail:"Temporäre Datei im Systembereich"},
{id:"f13",name:"Präsentation.pptx",path:"/home/share/klassen/8a",drive:"S:",size:"3.1 MB",type:"PowerPoint",state:"clean",detail:"Präsentation"},
{id:"f14",name:"update_service.exe",path:"/system/services",drive:"C:",size:"860 KB",type:"Executable",state:"malicious",detail:"Simulierte unbekannte Testsignatur"},
{id:"f15",name:"Kursmaterial.zip",path:"/home/share/lehrer",drive:"S:",size:"15 MB",type:"ZIP",state:"clean",detail:"Archiv mit Unterrichtsmaterial"},
{id:"f16",name:"readme.txt.exe",path:"/home/share/public",drive:"S:",size:"28 KB",type:"Executable",state:"malicious",detail:"Executable mit Textdatei-Tarnnamen"},
{id:"f17",name:"desktop.ini",path:"/home/share/user/anna",drive:"U:",size:"1 KB",type:"System meta",state:"clean",detail:"Übliche Windows-Systemdatei"},
{id:"f18",name:"cache-index.bin",path:"/system/cache",drive:"C:",size:"2.2 MB",type:"BIN",state:"suspicious",detail:"Binärdatei im Cache-Verzeichnis ohne bekannte Zuordnung"}
];
const usersSeed=[["u1","anna.schmidt","Anna Schmidt","Lehrkraft","U:","Aktiv"],["u2","max.mueller","Max Müller","Schüler","U:","Aktiv"],["u3","lena.weber","Lena Weber","Schüler","U:","Aktiv"],["u4","admin","IT-Administrator","Admin","C: / S:","Aktiv"],["u5","sekretariat","Sekretariat","Verwaltung","S:","Aktiv"],["u6","gast-07","Gastkonto 07","Gast","U:","Aktiv"],["u7","technik","Technik","Service","C:","Aktiv"]];
const driveSeed=[{letter:"C:",name:"System",total:120,used:72,status:"Online"},{letter:"S:",name:"Schulfreigabe",total:500,used:316,status:"Online"},{letter:"U:",name:"Benutzerlaufwerk",total:250,used:129,status:"Online"},{letter:"D:",name:"Downloads",total:80,used:22,status:"Online"}];
let files=structuredClone(initialFiles),users=usersSeed.map(a=>({id:a[0],user:a[1],name:a[2],role:a[3],drive:a[4],status:a[5]})),drives=structuredClone(driveSeed),quarantine=[],events=[],serverLocked=false,scanEvery=19,scanTimer=null,scanCount=0,scanning=false,previousResults=[];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function time(){return new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}
function log(msg,kind="info"){events.unshift({time:time(),msg,kind});events=events.slice(0,100)}
function counts(){return {danger:files.filter(f=>f.state==="malicious"||f.state==="suspicious").length,quarantine:quarantine.length,locked:users.filter(u=>u.status==="Gesperrt").length}}
function badge(state){const map={clean:["Unauffällig","good"],malicious:["Malware-Test","bad"],suspicious:["Verdächtig","warn"],locked:["Gesperrt","bad"],"Prüfung erforderlich":["Prüfung","warn"],"Kein Treffer":["Kein Treffer","good"],"Online":["Online","good"],"Offline":["Gesperrt","bad"],"Aktiv":["Aktiv","good"],"Gesperrt user":["Gesperrt","bad"],quarantined:["Quarantäne","bad"]};let a=map[state]||[state,""];return '<span class="tag '+a[1]+'">'+a[0]+'</span>'}
function setPage(p){document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render(p)}
document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>setPage(b.dataset.page));
function header(title,sub,actions=""){return '<div class="topline"><div><div class="pageTitle">'+title+'</div><div class="subtitle">'+sub+'</div></div>'+actions+'</div>'}
function scanButton(){return '<button class="btn primary" onclick="runScan()">Scan jetzt ausführen</button>'}
function stat(label,val,hint){return '<div class="card"><div class="cardlabel">'+label+'</div><div class="cardvalue">'+val+'</div><div class="cardhint">'+hint+'</div></div>'}
function filesTable(list,actions=true){return '<div class="tablewrap"><table class="table"><thead><tr><th>NAME</th><th>PFAD / LAUFWERK</th><th>KLASSIFIZIERUNG</th><th>ANALYSE</th><th>AKTION</th></tr></thead><tbody>'+list.map(f=>'<tr><td><b>'+esc(f.name)+'</b><span class="smallmuted">'+esc(f.size)+' · '+esc(f.type)+'</span></td><td>'+esc(f.path)+'<span class="smallmuted">'+esc(f.drive)+'</span></td><td>'+badge(f.state)+'</td><td>'+esc(f.detail)+'</td><td><div class="rowbtns">'+(f.state==="malicious"||f.state==="suspicious"?'<button class="btn tiny" onclick="quarantineFile(\''+f.id+'\')">Quarantäne</button>':'')+'</div></td></tr>').join("")+'</tbody></table></div>'}
function overview(){let c=counts();return header("Serverübersicht","Simulierte Umgebung · "+(serverLocked?"Server gesperrt":"Server online"),scanButton())+(serverLocked?'<div class="notice red">Server ist im Simulator gesperrt. Neue Scans und Aktionen werden blockiert, bis die Serversperre aufgehoben wird.</div>':'<div class="notice">Isolierte Simulation: Beispielkonten, Laufwerke und Testdateien. Keine Verbindung zu echten Schulservern.</div>')+'<section class="cards">'+stat("Serverstatus",serverLocked?"GESPERRT":"ONLINE","Simulierter Host · SSS-Lab") +stat("Benutzer",users.length,users.filter(u=>u.status==="Gesperrt").length+" gesperrt")+stat("Dateien im Modell",files.length,"Überwachte Dateieinträge")+stat("Bedrohungsindikatoren",c.danger,"Funde und Verdachtsfälle")+'</section><div class="grid2"><section class="panel"><div class="panelhead"><div class="paneltitle">Letzte Prüfergebnisse</div><span class="smallmuted">'+(scanCount?"Scan #"+scanCount:"Noch nicht gescannt")+'</span></div>'+ (previousResults.length?filesTable(previousResults.slice(0,6),false):'<div class="empty">Starte einen Scan, um hier die Resultate zu sehen.</div>')+'</section><section class="panel"><div class="panelhead"><div class="paneltitle">Laufwerksstatus</div><span class="smallmuted">Simulierte Laufwerke</span></div>'+drives.map(d=>'<div style="padding:8px 0;border-bottom:1px solid #eef2ef"><div class="drivehead"><b>'+d.letter+' · '+d.name+'</b>'+badge(d.status)+'</div><div class="smallmuted">'+d.used+' GB von '+d.total+' GB belegt</div></div>').join("")+'</section></div><section class="panel"><div class="panelhead"><div class="paneltitle">Aktuelle Ereignisse</div><button class="btn tiny" onclick="setPage(\'events\')">Protokoll öffnen</button></div>'+logsHTML(5)+'</section>'}
function filesPage(){return header("Dateiüberwachung","Alle Dateien im simulierten Server · Tests erfolgen zyklisch",scanButton())+'<div class="panel"><div class="panelhead"><div class="paneltitle">Bestandsdateien</div><span class="smallmuted">Keine Uploads · Testbestand fest vorgegeben</span></div>'+filesTable(files)+'</div>'}
function usersPage(){return header("Benutzerverwaltung","Konten des simulierten Servers verwalten")+'<div class="panel"><div class="panelhead"><div class="paneltitle">Benutzerkonten</div><span class="smallmuted">'+users.length+' Konten im Modell</span></div><div class="tablewrap"><table class="table"><thead><tr><th>BENUTZER</th><th>ROLLE</th><th>LAUFWERK</th><th>STATUS</th><th>AKTION</th></tr></thead><tbody>'+users.map(u=>'<tr><td><b>'+esc(u.user)+'</b><span class="smallmuted">'+esc(u.name)+'</span></td><td>'+esc(u.role)+'</td><td>'+esc(u.drive)+'</td><td>'+badge(u.status==="Gesperrt"?"Gesperrt user":"Aktiv")+'</td><td><button class="btn tiny '+(u.status==="Gesperrt"?"":"danger")+'" onclick="toggleUser(\''+u.id+'\')">'+(u.status==="Gesperrt"?"Entsperren":"Sperren")+'</button></td></tr>').join("")+'</tbody></table></div></div>'}
function drivesPage(){return header("Laufwerke","Status, Speicherbelegung und simulierte Sperrung")+'<div class="drivegrid">'+drives.map(d=>'<article class="drive"><div class="drivehead"><div><div class="driveletter">'+d.letter+'</div><b>'+d.name+'</b></div>'+badge(d.status)+'</div><div class="smallmuted" style="margin-top:8px">'+d.used+' GB / '+d.total+' GB</div><div class="bar"><span style="width:'+Math.round(d.used/d.total*100)+'%"></span></div><div class="smallmuted">'+Math.round(d.used/d.total*100)+'% belegt</div><button class="btn tiny '+(d.status==="Online"?"danger":"")+'" style="margin-top:12px" onclick="toggleDrive(\''+d.letter+'\')">'+(d.status==="Online"?"Laufwerk sperren":"Laufwerk entsperren")+'</button></article>').join("")+'</div><div class="panel" style="margin-top:15px"><div class="paneltitle">Zugriffshinweis</div><p class="smallmuted">Laufwerkssperren wirken nur auf den Simulationsstatus. Sie trennen keine echten Geräte.</p></div>'}
function quarantinePage(){return header("Quarantäne","Isolierte simulierte Testdateien")+'<div class="panel"><div class="panelhead"><div class="paneltitle">Quarantänebestand</div><span class="smallmuted">'+quarantine.length+' Einträge</span></div>'+(quarantine.length?'<div class="tablewrap"><table class="table"><thead><tr><th>DATEI</th><th>VORHERIGER PFAD</th><th>STATUS</th><th>AKTION</th></tr></thead><tbody>'+quarantine.map(f=>'<tr><td><b>'+esc(f.name)+'</b></td><td>'+esc(f.path)+'</td><td>'+badge("quarantined")+'</td><td><button class="btn tiny" onclick="restoreFile(\''+f.id+'\')">Wiederherstellen</button></td></tr>').join("")+'</tbody></table></div>':'<div class="empty">Quarantäne ist leer. Verdächtige Dateien können aus der Dateiliste isoliert werden.</div>')+'</div>'}
function logsHTML(n=80){return events.length?'<div class="loglist">'+events.slice(0,n).map(e=>'<div class="log"><span class="logtime">'+e.time+'</span><span>'+esc(e.msg)+'</span></div>').join("")+'</div>':'<div class="empty">Noch keine Ereignisse.</div>'}
function eventsPage(){return header("Ereignisprotokoll","Scan-, Sperr-, Quarantäne- und Systemereignisse",'<button class="btn" onclick="clearLogs()">Protokoll zurücksetzen</button>')+'<section class="panel">'+logsHTML()+'</section>'}
function emergencyPage(){return header("Notfallmaßnahmen","Simulierte Reaktionen auf Sicherheitsereignisse")+'<div class="notice red">Diese Schalter ändern ausschließlich den virtuellen Serverzustand. Es werden keine echten Konten oder Laufwerke gesperrt.</div><div class="cards">'+stat("Server",serverLocked?"Gesperrt":"Online","Gesamtzugriff") +stat("Aktive Konten",users.filter(u=>u.status==="Aktiv").length,"Benutzer im Modell")+stat("Online-Laufwerke",drives.filter(d=>d.status==="Online").length,"Laufwerke im Modell")+stat("Quarantäne",quarantine.length,"Isolierte Dateien")+'</section><div class="grid2"><section class="panel"><div class="paneltitle">Server-Notfallsperre</div><p class="smallmuted">Simuliert das Sperren sämtlicher Serverzugriffe.</p><button class="btn danger" onclick="confirmAction(\'serverLock\')">Gesamten Server sperren</button> <button class="btn" onclick="confirmAction(\'serverUnlock\')">Server entsperren</button></section><section class="panel"><div class="paneltitle">Massenaktionen</div><p class="smallmuted">Konten oder Laufwerke einzeln oder gesammelt sperren.</p><div class="actions"><button class="btn danger" onclick="confirmAction(\'usersLock\')">Alle Nutzer sperren</button><button class="btn" onclick="confirmAction(\'usersUnlock\')">Alle Nutzer entsperren</button><button class="btn danger" onclick="confirmAction(\'drivesLock\')">Alle Laufwerke sperren</button><button class="btn" onclick="confirmAction(\'drivesUnlock\')">Alle Laufwerke entsperren</button></div></section></div>'}
function settingsPage(){return header("Scan-Einstellungen","Intervall, Scanstatus und Simulator-Verhalten")+'<section class="panel"><div class="paneltitle">Automatische Überwachung</div><p class="smallmuted">Der Simulator scannt den vorbereiteten Dateibestand automatisch. Beim Verlassen oder Neuladen wird alles zurückgesetzt.</p><div class="settingsline"><label>Intervall in Minuten</label><input id="intervalField" type="number" min="1" max="1440" value="'+scanEvery+'"><button class="btn primary" onclick="saveInterval()">Intervall speichern</button><button class="btn" onclick="runScan()">Scan jetzt ausführen</button></div><p class="smallmuted">Nächster Scan: <b id="nextScanLabel">in '+scanEvery+' Minuten</b> (Timer wird bei aktivem Tab ausgeführt).</p></section><section class="panel"><div class="paneltitle">Regelübersicht</div><ul class="smallmuted"><li>Bekannte Testsignaturen / simulierte Malware-Klassifizierung</li><li>Irreführende Doppelerweiterungen und executable Dateiendungen</li><li>Ungewöhnliche Systempfade, Systemnamen-Imitationen</li><li>Ungewöhnliche Kombinationen aus Dateityp, Ort und Namensgebung</li><li>Unauffällige Dateien und legitime ungewöhnliche Namen als Gegenproben</li></ul></section>'}
function render(p="overview"){let views={overview,files:filesPage,users:usersPage,drives:drivesPage,quarantine:quarantinePage,events:eventsPage,emergency:emergencyPage,settings:settingsPage};$("content").innerHTML=views[p]();let c=counts();$("qbadge").textContent=c.quarantine;$("qbadge").classList.toggle("hide",!c.quarantine);if(p==="settings")$("nextScanLabel").textContent="in "+scanEvery+" Minuten"}
let scanRules={};
function classify(file){if(file.state==="clean")return {result:"Kein Treffer",reason:"Keine aktivierte Regel hat angeschlagen"};if(file.state==="malicious")return {result:"Prüfung erforderlich",reason:"Signatur- oder Verhaltensindikator erkannt · "+file.detail};if(file.state==="suspicious")return {result:"Hinweis",reason:"Heuristische Prüfung: "+file.detail};return {result:"Kein Treffer",reason:"Keine Regel ausgelöst"}}
function runScan(){if(serverLocked){alert("Server gesperrt. Entsperre ihn für den Scan.");return}if(scanning)return;scanning=true;scanCount++;log("Scan #"+scanCount+" gestartet · "+files.length+" Dateien werden geprüft.");let idx=0,acc=[];const timer=setInterval(()=>{if(idx>=files.length){clearInterval(timer);scanning=false;previousResults=acc;let detections=acc.filter(x=>x.status!=="Kein Treffer").length;log("Scan #"+scanCount+" abgeschlossen · "+detections+" Hinweise/Funde · "+acc.length+" Dateien verarbeitet.");render(activePage);return}const f=files[idx++];let c=classify(f);acc.push({...f,status:c.result,detail:c.reason});$("status")?.replaceChildren(document.createTextNode("Scan läuft · "+idx+" / "+files.length));},60)}
let activePage="overview";const origSetPage=setPage;setPage=function(p){activePage=p;origSetPage(p)};const origRender=render;render=function(p){origRender(p);if(p==="overview"&&scanning){let statusNode=document.querySelector(".subtitle");if(statusNode)statusNode.textContent="Simulierter Host · Scan läuft…"}};
function quarantineFile(id){if(serverLocked){alert("Server gesperrt. Aktion blockiert.");return}let f=files.find(x=>x.id===id);if(!f)return;quarantine.push({...f,previousState:f.state});files=files.filter(x=>x.id!==id);log("Datei in Quarantäne verschoben: "+f.name);render(activePage)}
function restoreFile(id){let f=quarantine.find(x=>x.id===id);if(!f)return;quarantine=quarantine.filter(x=>x.id!==id);files.push({...f,state:f.previousState||"suspicious"};log("Datei aus Quarantäne wiederhergestellt: "+f.name);render(activePage)}
function toggleUser(id){if(serverLocked){alert("Server gesperrt. Nutzerverwaltung blockiert.");return}let u=users.find(x=>x.id===id);if(!u)return;u.status=u.status==="Gesperrt"?"Aktiv":"Gesperrt";log("Benutzer "+u.user+" "+(u.status==="Gesperrt"?"gesperrt":"entsperrt"));render(activePage)}
function toggleDrive(letter){if(serverLocked){alert("Server gesperrt. Laufwerksaktion blockiert.");return}let d=drives.find(x=>x.letter===letter);if(!d)return;d.status=d.status==="Online"?"Offline":"Online";log("Laufwerk "+letter+" "+(d.status==="Offline"?"gesperrt":"entsperrt"));render(activePage)}
function clearLogs(){events=[];render(activePage)}
function saveInterval(){let n=Number(document.getElementById("intervalField").value);if(!Number.isFinite(n)||n<1||n>1440){alert("Intervall bitte zwischen 1 und 1440 Minuten eingeben.");return}scanEvery=Math.floor(n);if(scanTimer)clearInterval(scanTimer);scanTimer=setInterval(runScan,scanEvery*60*1000);log("Automatisches Scanintervall auf "+scanEvery+" Minuten gesetzt.");render(activePage)}
let pendingAction=null;function confirmAction(action){pendingAction=action;const titles={serverLock:"Server sperren?",serverUnlock:"Server entsperren?",usersLock:"Alle Nutzer sperren?",usersUnlock:"Alle Nutzer entsperren?",drivesLock:"Alle Laufwerke sperren?",drivesUnlock:"Alle Laufwerke entsperren?"};const texts={serverLock:"Alle simulierten Zugriffe werden blockiert. Fortfahren?",serverUnlock:"Serverzugriffe wieder freigeben?",usersLock:"Alle Konten in diesem Modell werden gesperrt.",usersUnlock:"Alle Modell-Konten werden wieder aktiviert.",drivesLock:"Alle Laufwerke im Simulator offline schalten.",drivesUnlock:"Alle Laufwerke im Modell wieder freigeben."};$("confirmTitle").textContent=titles[action];$("confirmText").textContent=texts[action];$("confirm").style.display="flex"}
$("confirmCancel").onclick=()=>{$("confirm").style.display="none";pendingAction=null};
$("confirmOK").onclick=()=>{$("confirm").style.display="none";const a=pendingAction;pendingAction=null;if(a==="serverLock"){serverLocked=true;log("NOTFALL: Gesamter simulierter Server gesperrt.","danger")}if(a==="serverUnlock"){serverLocked=false;log("Server-Simulation wieder freigegeben.")}if(a==="usersLock"){users.forEach(u=>u.status="Gesperrt");log("Notfallaktion: alle Nutzerkonten gesperrt.")}if(a==="usersUnlock"){users.forEach(u=>u.status="Aktiv");log("Notfallaktion: alle Nutzerkonten entsperrt.")}if(a==="drivesLock"){drives.forEach(d=>d.status="Offline");log("Notfallaktion: alle Laufwerke offline geschaltet.")}if(a==="drivesUnlock"){drives.forEach(d=>d.status="Online");log("Notfallaktion: alle Laufwerke online geschaltet.")}render(activePage)};
let lastRun=Date.now();scanTimer=setInterval(()=>{if(!serverLocked){runScan();lastRun=Date.now()}},scanEvery*60*1000);
log("Simulator gestartet · automatischer Scan alle "+scanEvery+" Minuten.");
render("overview");
</script></body></html>
