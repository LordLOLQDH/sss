name: Build Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m compileall -q sss_core.py sss_ai.py sss_gui.py sss_scanner.py
      - run: python -m unittest discover -s tests -v
      - run: pyinstaller --noconfirm --clean --windowed --onefile --name SSS sss_gui.py
      - uses: jrsoftware/issuest@v1
        with:
          script: installer/sss.iss
      - name: Generate installer SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash installer/dist/SSS-Setup-2.0.0.exe -Algorithm SHA256).Hash
          "$hash  SSS-Setup-2.0.0.exe" | Out-File installer/dist/SSS-Setup-2.0.0.exe.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: SSS-Windows-Installer
          path: |
            installer/dist/SSS-Setup-2.0.0.exe
            installer/dist/SSS-Setup-2.0.0.exe.sha256
      - name: Publish tagged installer release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/dist/SSS-Setup-2.0.0.exe
            installer/dist/SSS-Setup-2.0.0.exe.sha256
