name: Python validation and source package
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: sss-latest-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependency
        run: python -m pip install -r SSS_Data/requirements.txt
      - name: Compile main application and manager
        run: python -m py_compile sss_main.py SSS_Data/tools/sss_manager.py tests/test_setup_wizard.py
      - name: Test first-run setup (no-admin and optional profiles)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python tests/test_setup_wizard.py
      - name: Validate metadata
        run: python -c "import json; json.load(open('SSS_Data/version.json', encoding='utf-8')); json.load(open('version.json', encoding='utf-8'))"
      - name: Package clean Python app
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $cacheDirs = Get-ChildItem -Path . -Directory -Filter "__pycache__" -Recurse -ErrorAction SilentlyContinue
          foreach ($dir in $cacheDirs) { Remove-Item $dir.FullName -Recurse -Force }
          Compress-Archive -Path sss_main.py, SSS_Data, Start-SSS.bat -DestinationPath SSS-Windows.zip -Force
          $zip = [System.IO.Compression.ZipFile]::OpenRead("SSS-Windows.zip")
          try {
            $entries = $zip.Entries | ForEach-Object { $_.FullName }
            $exeEntries = $entries | Where-Object { $_ -match "[.]exe$" }
            $allowedSamples = @("SSS_Data/demo_test_files/07_probe.exe", "SSS_Data/demo_test_files/08_probe.txt.exe")
            $unexpected = $exeEntries | Where-Object { $_ -notin $allowedSamples }
            if ($unexpected) { throw "Nicht erlaubte EXE-Dateien im Paket: $($unexpected -join ', ')" }
            foreach ($sample in $allowedSamples) {
              $entry = $zip.GetEntry($sample)
              if ($null -eq $entry -or $entry.Length -ne 0) { throw "Exe-Testdatei fehlt oder enthält Bytes: $sample" }
            }
            if ($entries | Where-Object { $_ -match "__pycache__|[.]pyc$" }) { throw "Python-Cache-Dateien im Release-ZIP" }
          } finally {
            $zip.Dispose()
          }
          Copy-Item SSS-Windows.zip SSS-Windows-Python.zip -Force
          Copy-Item SSS_Data/tools/sss_manager.py SSS-Manager.py -Force
      - name: Publish Python-only package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SSS Windows · Python-Version
          prerelease: true
          body: "Aktueller Download: SSS-Windows.zip. Nur Python-Quellcode, Daten und Startskript; kein EXE. Der erste Start richtet eine private Python-Umgebung ohne Administratorrechte ein. Schule und Schulserver sind optional; die aktuelle Version arbeitet lokal."
          files: |
            SSS-Windows.zip
            SSS-Windows-Python.zip
            SSS-Manager.py
          overwrite_files: true
      - name: Verify latest release asset and direct download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/LordLOLQDH/sss/releases/tags/latest" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -eq "SSS-Windows.zip" } | Select-Object -First 1
          $url = "https://github.com/LordLOLQDH/sss/releases/download/latest/SSS-Windows.zip"
          if ($null -eq $asset) { throw "Latest-Release enthält SSS-Windows.zip nicht." }
          if ($asset.browser_download_url -ne $url) { throw "Download-URL stimmt nicht mit dem erwarteten Direktlink überein." }
          $target = Join-Path $env:TEMP "SSS-Windows-direct-link-check.zip"
          Invoke-WebRequest -Uri $url -OutFile $target -TimeoutSec 180
          if (-not (Test-Path $target)) { throw "Direktdownload hat keine Datei erstellt." }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($target)
          try {
            $entries = $zip.Entries | ForEach-Object { $_.FullName }
            $required = @("sss_main.py", "Start-SSS.bat", "SSS_Data/version.json", "SSS_Data/requirements.txt", "SSS_Data/tools/sss_manager.py")
            foreach ($item in $required) {
              if ($entries -notcontains $item) { throw "Downloadpaket unvollständig: $item" }
            }
            $exeEntries = $entries | Where-Object { $_ -match "[.]exe$" }
            $allowedSamples = @("SSS_Data/demo_test_files/07_probe.exe", "SSS_Data/demo_test_files/08_probe.txt.exe")
            $unexpected = $exeEntries | Where-Object { $_ -notin $allowedSamples }
            if ($unexpected) { throw "Nicht erlaubte EXE-Dateien im Download: $($unexpected -join ', ')" }
            foreach ($sample in $allowedSamples) {
              $entry = $zip.GetEntry($sample)
              if ($null -eq $entry -or $entry.Length -ne 0) { throw "Exe-Testdatei fehlt oder enthält Bytes: $sample" }
            }
            if ($entries | Where-Object { $_ -match "__pycache__|[.]pyc$" }) { throw "Python-Cache-Dateien im Download-ZIP" }
          } finally {
            $zip.Dispose()
            Remove-Item $target -Force -ErrorAction SilentlyContinue
          }
          Write-Host "Verifizierter Direktdownload: $url"
      - name: Remove obsolete executable bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          try {
            Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/LordLOLQDH/sss/releases/assets/800286347" -Headers $headers
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }
