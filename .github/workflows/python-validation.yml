name: Python validation and source package
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile main application
        run: python -m py_compile sss_main.py
      - name: Compile standalone manager
        run: python -m py_compile SSS_Data/tools/sss_manager.py
      - name: Validate metadata
        run: python -c "import json; json.load(open('SSS_Data/version.json', encoding='utf-8')); json.load(open('version.json', encoding='utf-8'))"
      - name: Package clean Python app
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          Compress-Archive -Path sss_main.py, SSS_Data -DestinationPath SSS-Windows-Python.zip -Force
          Copy-Item SSS_Data/tools/sss_manager.py SSS-Manager.py
      - name: Publish Python-only package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SSS Windows · Python-Version
          prerelease: true
          body: "Aktueller Download: SSS-Windows-Python.zip. Das ältere SSS-Windows.zip ist ein historisches Paket und nicht mehr für Neuinstallationen vorgesehen."
          files: |
            SSS-Windows-Python.zip
            SSS-Manager.py
          overwrite_files: true
      - name: Remove obsolete executable bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          try {
            Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/LordLOLQDH/sss/releases/assets/800286347" -Headers $headers
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }
