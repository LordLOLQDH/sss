name: SSS Python source validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python syntax
        run: python -m py_compile sss_gui.py sss_core.py sss_ai.py sss_updater.py sss_setup.py
      - name: Validate updater imports
        run: python -c "import sss_updater, sss_ai, sss_core; print('SSS source validation OK')"
