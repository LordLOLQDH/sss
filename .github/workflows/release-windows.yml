name: SSS Python source validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python syntax
        run: python -m py_compile sss_main.py
      - name: Validate app metadata
        run: python -c "import json; json.load(open('SSS_Data/version.json', encoding='utf-8')); print('SSS source validation OK')"
