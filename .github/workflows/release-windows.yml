name: Build SSS Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sss-windows-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Validate Python source
        run: python -m py_compile sss_gui.py sss_core.py sss_ai.py sss_updater.py sss_setup.py

      - name: Build standalone desktop app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name SSS --add-data "assets;assets" --add-data "version.json;." sss_gui.py
          if (!(Test-Path "dist/SSS.exe")) { throw "SSS.exe was not created." }
          Compress-Archive -Path "dist/SSS.exe" -DestinationPath "dist/SSS-Windows.zip" -Force

      - name: Publish latest Windows ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SSS Windows · Latest build
          target_commitish: main
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/SSS-Windows.zip
