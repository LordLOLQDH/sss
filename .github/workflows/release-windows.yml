name: SSS Windows source package build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependency
        run: python -m pip install -r SSS_Data/requirements.txt
      - name: Compile app, manager and setup test
        run: python -m py_compile sss_main.py SSS_Data/tools/sss_manager.py tests/test_setup_wizard.py
      - name: Test first-run setup (no-admin and optional profiles)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python tests/test_setup_wizard.py
      - name: Build source-only Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path sss_main.py, SSS_Data, Start-SSS.bat -DestinationPath SSS-Windows.zip -Force
          $zip = [System.IO.Compression.ZipFile]::OpenRead("SSS-Windows.zip")
          try {
            $entries = $zip.Entries | ForEach-Object { $_.FullName }
            $required = @("sss_main.py", "Start-SSS.bat", "SSS_Data/version.json", "SSS_Data/requirements.txt", "SSS_Data/tools/sss_manager.py")
            foreach ($item in $required) {
              if ($entries -notcontains $item) { throw "Paketdatei fehlt: $item" }
            }
            if ($entries | Where-Object { $_ -match "\\.exe$" }) { throw "EXE-Datei im Python-Paket gefunden" }
            Write-Host "SSS-Windows.zip package content verified."
          } finally {
            $zip.Dispose()
          }
      - name: Upload Windows source package
        uses: actions/upload-artifact@v4
        with:
          name: SSS-Windows-source-package
          path: SSS-Windows.zip
          if-no-files-found: error
          retention-days: 7
